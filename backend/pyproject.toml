[project]
name = "creatorhub-backend"
version = "0.1.0"
description = "CreatorHub Content Calendar API"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.41",
    "sqlmodel>=0.0.27",
    "alembic>=1.18",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.13",
    # `pydantic[email]` for EmailStr: contracts/openapi.yaml declares the login email as
    # `format: email`, and without email-validator installed that field can only be a bare string —
    # the generated OpenAPI would then disagree with the contract the frontend client is built from.
    "pydantic[email]>=2.12",
    "pyjwt>=2.12",
    # Password hashing. NOT passlib — see the comment under [tool.uv] below.
    "pwdlib[bcrypt]>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    # FastAPI's TestClient needs httpx at runtime; it is not pulled in by bare `fastapi`.
    "httpx>=0.28",
    "ruff>=0.16",
    "mypy>=2.3",
]

# Application, not a library: nothing installs `app` as a distribution. `uv run` puts the project
# root on sys.path, which is what `uvicorn app.main:app` and `python -m app.scripts.seed_user` need.
[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Why pwdlib and not passlib[bcrypt]
# ---------------------------------------------------------------------------
# T002 required verifying passlib on Python 3.13 before committing to it. It fails, and not in the
# way .claude/memory.md predicted. The recorded trap was passlib reading `bcrypt.__about__`, removed
# in bcrypt >= 4.1. The actual failure with bcrypt 5.0.0 is different and happens at first use:
#
#   ValueError: password cannot be longer than 72 bytes, truncate manually if necessary
#
# raised from passlib's own backend-capability probe (`detect_wrap_bug`), which hashes an
# over-72-byte password expecting bcrypt to truncate it. bcrypt 5.0 raises instead. passlib 1.7.4 is
# unmaintained and will not be fixed. Every CryptContext with bcrypt is dead on arrival.
#
# pwdlib is the maintained replacement, verified working on Python 3.13 with bcrypt 5.0.0.
#
# Inherited constraint: bcrypt still refuses passwords over 72 bytes rather than truncating them, so
# the seed script (T015) and login (T012) must bound password length at the boundary. That is a real
# behaviour of the algorithm, not a library quirk, so it belongs in validation rather than a wrapper.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# `app` is not an installed distribution (see [tool.uv] package = false), and pytest's default
# import mode only puts the test file's own directory on sys.path — so `from app.config import ...`
# would not resolve.
pythonpath = ["."]
# Phase 1 has no real tests yet, and pytest exits 5 — not 0 — when it collects nothing, which CI
# reads as a failure. tests/test_placeholder.py keeps the suite non-empty until T017 lands.

# ---------------------------------------------------------------------------
# ruff — these are the settings the CI `review` stage runs. Failing them blocks
# merge (constitution VI), so anything enabled here has to be worth a red build.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting — settles a whole class of diff noise mechanically
    "N",       # pep8-naming
    "UP",      # pyupgrade — this is a 3.13-only codebase, so old idioms are just old
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "PTH",     # prefer pathlib
    "ARG",     # unused arguments — catches a renamed FastAPI dependency parameter
    "RUF",     # ruff's own rules
    "S",       # bandit: the API holds a password hash and a signing secret
]
ignore = [
    # Asserts are how pytest works. Excluded for tests only, below.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Alembic's generated scaffolding does not follow the project's naming or import conventions, and
# rewriting each migration to satisfy the linter changes files that are supposed to be immutable
# once applied.
"alembic/env.py" = ["ARG", "N"]
"tests/**" = [
    "S101",  # assert is the point
    "S105",  # hardcoded password strings are test fixtures here, not credentials
    "S106",
    "ARG",   # pytest fixtures are frequently requested for their side effect only
]

# ---------------------------------------------------------------------------
# mypy — strict. Turning it on later, over a grown codebase, costs far more than
# starting here with three files.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["app", "tests"]
strict = true
plugins = ["pydantic.mypy"]
# Alembic revisions are generated, get partially hand-edited, and are never imported by application
# code. Type-checking them buys nothing and blocks merges on scaffolding.
exclude = "^alembic/versions/"
# A `# type: ignore` that stops being needed is a comment that lies about the code.
warn_unused_ignores = true
warn_unreachable = true
# Loud rather than silent: an untyped third-party import should be an explicit decision below, not a
# hole that quietly turns a checked module into an unchecked one.
disallow_any_unimported = true

[[tool.mypy.overrides]]
# SQLModel ships type information but its declarative metaclass defeats strict inference in places.
# Scoped to the library rather than relaxed globally.
module = ["sqlmodel.*"]
follow_untyped_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
