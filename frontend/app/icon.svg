<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" role="img" aria-label="Victor Tracker">
  <!--
    Favicon, drawn on a 16x16 grid rather than reusing assets/spidey-awake.svg directly.

    That source is 32x18 - wide and flat, with three legs a side. Scaled into a square tab icon it
    reads as a red smudge: at 16 device pixels each leg is one pixel with one pixel of gap, which is
    the size at which pixel art stops being art. The mascot's own MASCOT.md says as much ("below
    24px the props stop reading").

    So this keeps only what survives: the round body, the two eyes, and four short legs as a hint of
    the silhouette. Same palette as the mascot system.

    Next's App Router picks this up automatically from app/icon.svg - no <link> tag anywhere.
  -->
  <g shape-rendering="crispEdges">
    <!-- legs, upper pair -->
    <rect x="1" y="5" width="2" height="1" fill="#A81222"/>
    <rect x="13" y="5" width="2" height="1" fill="#A81222"/>
    <!-- legs, lower pair -->
    <rect x="1" y="9" width="2" height="1" fill="#A81222"/>
    <rect x="13" y="9" width="2" height="1" fill="#A81222"/>

    <!-- body -->
    <rect x="5" y="2" width="6" height="1" fill="#FF1F35"/>
    <rect x="4" y="3" width="8" height="1" fill="#FF1F35"/>
    <rect x="3" y="4" width="10" height="1" fill="#FF1F35"/>
    <rect x="3" y="5" width="10" height="1" fill="#FF1F35"/>

    <!-- eye row: red, black eyes with a cream highlight, red -->
    <rect x="3" y="6" width="1" height="2" fill="#FF1F35"/>
    <rect x="4" y="6" width="1" height="1" fill="#F5F2E8"/>
    <rect x="5" y="6" width="2" height="2" fill="#0B0D10"/>
    <rect x="4" y="7" width="1" height="1" fill="#0B0D10"/>
    <rect x="7" y="6" width="2" height="2" fill="#FF1F35"/>
    <rect x="9" y="6" width="1" height="1" fill="#F5F2E8"/>
    <rect x="10" y="6" width="2" height="2" fill="#0B0D10"/>
    <rect x="9" y="7" width="1" height="1" fill="#0B0D10"/>
    <rect x="12" y="6" width="1" height="2" fill="#FF1F35"/>

    <!-- lower body -->
    <rect x="3" y="8" width="10" height="1" fill="#FF1F35"/>
    <rect x="4" y="9" width="8" height="1" fill="#FF1F35"/>
    <rect x="4" y="10" width="8" height="1" fill="#A81222"/>
    <rect x="5" y="11" width="6" height="1" fill="#A81222"/>
    <rect x="6" y="12" width="4" height="1" fill="#A81222"/>
  </g>
</svg>
